<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloodLink - Emergency Blood Donation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #1f2937;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #6b2121, #dc2626);
      color: #ffffff;
      text-align: center;
      padding: 44px 20px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.92;
      font-size: 1rem;
    }

    .container {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px;
      display: grid;
      gap: 24px;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      color: #991b1b;
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #ffffff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #dc2626;
    }

    button {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #991b1b;
    }

    .btn-secondary {
      background: #374151;
    }

    .btn-secondary:hover {
      background: #1f2937;
    }

    .donor-list {
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    .donor-item {
      border: 1px solid #e5e7eb;
      border-left: 4px solid #dc2626;
      border-radius: 8px;
      padding: 14px;
      background: #fafafa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      background: #fee2e2;
      color: #991b1b;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-left: 8px;
    }

    .meta {
      font-size: 0.9rem;
      color: #4b5563;
      margin-top: 4px;
    }

    .empty {
      color: #6b7280;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>BloodLink - Emergency Blood Donation</h1>
    <p>Register as a volunteer blood donor and quickly find available donors by group & city.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Register as a Blood Donor</h2>
      <form id="donorForm">
        <div class="grid-2">
          <input type="text" id="name" placeholder="Full Name" required />
          <input type="number" id="age" placeholder="Age (18 - 65)" min="18" max="65" required />
          <select id="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
          <input type="text" id="city" placeholder="City" required />
          <input type="tel" id="phone" placeholder="Phone Number" required />
          <button type="submit">Add Donor</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Find Donors (<span id="totalCount">0</span>)</h2>
      <div class="grid-2">
        <select id="filterGroup" onchange="renderDonors()">
          <option value="">All Blood Groups</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
        <input type="text" id="filterCity" placeholder="Search by city..." oninput="renderDonors()" />
        <button type="button" class="btn-secondary" onclick="resetFilters()">Reset Filters</button>
      </div>

      <div id="donorList" class="donor-list"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "bloodlink_donors_v1";

    let donors = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      {
        id: 1,
        name: "Ramesh Kumar",
        age: 26,
        bloodGroup: "O+",
        city: "Hyderabad",
        phone: "9876543210"
      },
      {
        id: 2,
        name: "Ananya Rao",
        age: 23,
        bloodGroup: "B+",
        city: "Warangal",
        phone: "9123456780"
      }
    ];

    function saveDonors() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(donors));
    }

    function renderDonors() {
      const selectedGroup = document.getElementById("filterGroup").value;
      const cityQuery = document.getElementById("filterCity").value.trim().toLowerCase();
      const listEl = document.getElementById("donorList");
      const countEl = document.getElementById("totalCount");

      const filtered = donors.filter((donor) => {
        const matchesGroup = !selectedGroup || donor.bloodGroup === selectedGroup;
        const matchesCity = !cityQuery || donor.city.toLowerCase().includes(cityQuery);
        return matchesGroup && matchesCity;
      });

      countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        listEl.innerHTML = `<p class="empty">No matching donors found.</p>`;
        return;
      }

      listEl.innerHTML = filtered
        .map(
          (donor) => `
          <div class="donor-item">
            <div>
              <strong>${escapeHtml(donor.name)}</strong>
              <span class="badge">${escapeHtml(donor.bloodGroup)}</span>
              <div class="meta">City: ${escapeHtml(donor.city)} | Age: ${donor.age} | Phone: ${escapeHtml(donor.phone)}</div>
            </div>
            <button type="button" class="btn-secondary" onclick="deleteDonor(${donor.id})">Remove</button>
          </div>
        `
        )
        .join("");
    }

    function deleteDonor(id) {
      donors = donors.filter((d) => d.id !== id);
      saveDonors();
      renderDonors();
    }

    function resetFilters() {
      document.getElementById("filterGroup").value = "";
      document.getElementById("filterCity").value = "";
      renderDonors();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("donorForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const newDonor = {
        id: Date.now(),
        name: document.getElementById("name").value.trim(),
        age: Number(document.getElementById("age").value),
        bloodGroup: document.getElementById("bloodGroup").value,
        city: document.getElementById("city").value.trim(),
        phone: document.getElementById("phone").value.trim()
      };

      donors.unshift(newDonor);
      saveDonors();
      renderDonors();
      e.target.reset();
    });

    renderDonors();
  </script>
</body>
</html>
